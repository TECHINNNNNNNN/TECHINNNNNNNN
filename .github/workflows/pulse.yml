name: pulse

on:
  schedule:
    - cron: "7 * * * *" # hourly, off-peak minute
  workflow_dispatch:
  push:
    paths: ["status/**"]

permissions:
  contents: write

jobs:
  pulse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node status/build.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          git config user.name "pulse-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || (git commit -m "$(cat status/commit-msg.txt)" && git push)
